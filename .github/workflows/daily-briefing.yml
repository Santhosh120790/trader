name: Daily market briefing

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the briefing Space
        run: |
          curl -sf "https://jsanthosh-daily-market-briefing.hf.space/run?key=${{ secrets.BRIEFING_KEY }}"
